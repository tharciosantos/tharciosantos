name: Metrics

on:
  schedule:
  - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - uses: lowlighter/metrics@latest
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        filename: github-metrics.svg
        plugin_languages: yes
        plugin_languages_analysis_timeout: 15
        config_timezone: America/Sao_Paulo
